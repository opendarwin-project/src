# Config for PORTAGE_CONFIGROOT=/usr/arm64-apple-darwin
# Merges land at ROOT=/usr/arm64-apple-darwin (plain /usr in the ebuild).
ROOT="/usr/arm64-apple-darwin/"
# Keep host CHOST so toolchain-funcs does not look for arm64-apple-darwin-gcc
# while compiling host SETUP tools / cmake.
CHOST="x86_64-pc-linux-gnu"
CBUILD="x86_64-pc-linux-gnu"
CTARGET="arm64-apple-darwin"
ACCEPT_KEYWORDS="arm64-macos ~arm64-macos"
USE="prefix-guest clang lld"
LLVM_SLOT="22"
COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FEATURES="-collision-protect -sandbox -usersandbox -userpriv -network-sandbox -pid-sandbox -ipc-sandbox -strict -multilib-strict"
DISTDIR="/var/cache/distfiles"
PKGDIR="/usr/arm64-apple-darwin/var/cache/binpkgs"
PORTAGE_TMPDIR="/usr/arm64-apple-darwin/var/tmp"
PATH="/usr/libexec/darwin:/usr/lib/llvm/22/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
