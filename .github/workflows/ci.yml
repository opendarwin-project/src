name: CI

on:
    push:
        branches:
            - dev
    pull_request:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: macos-latest
        permissions:
            id-token: write
            contents: read
        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
            - uses: xyzzylabs/setup-zig@v1
              with:
                version: 0.17.0
            - run: zig build
